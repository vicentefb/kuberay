# Stress-test RayJob — NOT part of the sample. Runs from the snapshotStress
# scratch branch. Tune the run via env_vars below.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: agent-sandbox-snapshot-stress
spec:
  entrypoint: python ray-operator/config/samples/agent-sandbox-snapshots/stress/stress_snapshot_execution.py
  runtimeEnvYAML: |
    pip:
      - k8s-agent-sandbox==1.0.0
    working_dir: "https://github.com/vicentefb/kuberay/archive/refs/heads/snapshotStress.zip"
    env_vars:
      NUM_EXECUTORS: "20"
      CYCLES: "5"
      STATE_MB: "64"
      MODEL_LATENCY: "5"
  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        dashboard-host: 0.0.0.0
      template:
        spec:
          containers:
          - image: rayproject/ray:2.55.0-py311
            name: ray-head
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            resources:
              requests:
                cpu: "2"
                memory: "4Gi"
              limits:
                cpu: "2"
                memory: "4Gi"
    workerGroupSpecs:
    - groupName: sandbox-executor-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 2
      rayStartParams: {}
      template:
        spec:
          containers:
          - image: rayproject/ray:2.55.0-py311
            name: ray-worker
            resources:
              requests:
                cpu: "1"
                memory: "2Gi"
              limits:
                cpu: "1"
                memory: "2Gi"
